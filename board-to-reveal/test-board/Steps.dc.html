<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Click steps (click Next)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; box-sizing: border-box; background: #FBFBFA; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
<div style="position: absolute; left: 64px; top: 48px; width: 1064px; font-size: 48px; line-height: 56px; font-weight: 600">Click steps (click Next)</div>
<div style="position: absolute; left: {{x}}px; top: 200px; width: 60px; height: 60px; border-radius: 30px; background: #2557D6; transition: left .5s ease, top .5s ease"></div>
<sc-if value="{{s2}}"><div style="position: absolute; left: 64px; top: 400px; font-size: 24px">Step two adds this text.</div></sc-if>
<div style="position: absolute; left: 64px; top: 600px; display: flex; gap: 8px"><button onClick="{{next}}">Next</button><button onClick="{{reset}}">Reset</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":0,"min":0,"max":2,"section":"Build"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
var self = this; var step = this.state.step; if (step === undefined || step === null) { step = this.props.step ?? 0; }
return { step: step, s2: step === 2, x: 64 + Math.min(step, 1) * 400, next: function () { self.setState({ step: Math.min(2, step + 1) }); }, reset: function () { self.setState({ step: 0 }); } };
}
}
</script>
</body>
</html>
